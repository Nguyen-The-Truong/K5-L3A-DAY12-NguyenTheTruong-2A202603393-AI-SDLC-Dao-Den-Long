<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đảo Đèn Lồng · Đêm 1: Đảo Bến</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      z-index: 10;
    }
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 28px;
      border-radius: 16px;
      border: 1px solid rgba(251, 191, 36, 0.35);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .title-box h1 {
      font-size: 20px;
      color: #fbbf24;
      text-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-box span {
      font-size: 13px;
      color: #94a3b8;
      font-weight: normal;
    }
    .stat-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: bold;
    }
    .time-badge { color: #38bdf8; }
    .score-badge { color: #fde047; }
    .lantern-badge { color: #fb923c; }

    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .player-stats {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      padding: 16px 22px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .flames-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .flame-icon {
      font-size: 24px;
      filter: drop-shadow(0 0 8px #f97316);
      transition: opacity 0.3s, transform 0.3s;
    }
    .flame-icon.lost {
      opacity: 0.15;
      filter: grayscale(1);
      transform: scale(0.8);
    }
    .carried-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
    }
    .carried-dots {
      display: flex;
      gap: 8px;
    }
    .mote-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 1px solid #fbbf24;
      transition: all 0.25s;
    }
    .mote-dot.filled {
      background: #facc15;
      box-shadow: 0 0 12px #facc15;
      transform: scale(1.15);
    }

    .controls-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      padding: 16px 22px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.7;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .key {
      display: inline-block;
      background: #334155;
      color: #f8fafc;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      border-bottom: 2px solid #1e293b;
      margin: 0 3px;
    }

    /* Modal End Screen */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 17, 32, 0.88);
      backdrop-filter: blur(14px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      pointer-events: auto;
    }
    .modal-content {
      background: #1e293b;
      padding: 40px;
      border-radius: 24px;
      border: 2px solid #f59e0b;
      text-align: center;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 12px 48px rgba(245, 158, 11, 0.35);
      animation: popIn 0.35s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-title {
      font-size: 32px;
      margin-bottom: 12px;
    }
    .modal-subtitle {
      font-size: 15px;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .modal-score {
      font-size: 22px;
      color: #fde047;
      margin-bottom: 28px;
    }
    .btn-restart {
      background: linear-gradient(135deg, #fbbf24, #ea580c);
      color: #0f172a;
      font-weight: bold;
      font-size: 16px;
      border: none;
      padding: 14px 34px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(234, 88, 12, 0.5);
      transition: transform 0.2s, background 0.2s;
    }
    .btn-restart:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #fde047, #f97316);
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <div class="hud-header">
      <div class="title-box">
        <h1>🏮 Đảo Đèn Lồng <span>· Đêm 1: Đảo Bến</span></h1>
      </div>
      <div class="stat-badge time-badge">
        ⏳ <span id="hud-time">180s</span>
      </div>
      <div class="stat-badge lantern-badge">
        🏮 <span id="hud-lanterns">0 / 5 Đèn</span>
      </div>
      <div class="stat-badge score-badge">
        ⭐ <span id="hud-score">0</span>
      </div>
    </div>

    <div class="hud-bottom">
      <div class="player-stats">
        <div class="flames-row">
          <span>Ngọn Lửa (HP):</span>
          <div id="flames-container">
            <span class="flame-icon" id="flame-1">🔥</span>
            <span class="flame-icon" id="flame-2">🔥</span>
            <span class="flame-icon" id="flame-3">🔥</span>
          </div>
        </div>
        <div class="carried-row">
          <span>Đom Đóm: <strong id="carried-count">0/5</strong></span>
          <div class="carried-dots" id="mote-dots">
            <div class="mote-dot"></div>
            <div class="mote-dot"></div>
            <div class="mote-dot"></div>
            <div class="mote-dot"></div>
            <div class="mote-dot"></div>
          </div>
        </div>
      </div>

      <div class="controls-card">
        <div><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> Di chuyển Mây</div>
        <div><span class="key">E</span> Thắp đèn (khi lại gần Đèn Lớn)</div>
        <div><span class="key">Q</span> Tỏa sáng (xua Bóng Mực, tốn 1 đom đóm)</div>
        <div><span class="key">Space</span> Nhảy nhẹ</div>
      </div>
    </div>
  </div>

  <div id="end-modal" class="modal-overlay">
    <div class="modal-content">
      <h2 id="modal-title" class="modal-title">CHIẾN THẮNG!</h2>
      <p id="modal-subtitle" class="modal-subtitle">5 Đèn Lồng Lớn đã bừng sáng rực rỡ, xua tan sương đen!</p>
      <div class="modal-score">Tổng điểm: <strong id="modal-score-val">1250</strong></div>
      <button id="btn-play-again" class="btn-restart">Chơi Lại</button>
    </div>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
