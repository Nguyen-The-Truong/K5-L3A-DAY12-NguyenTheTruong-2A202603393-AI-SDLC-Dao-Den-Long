<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đảo Đèn Lồng · Đêm 1: Đảo Bến</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090b10;
      color: #f3efe6;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(14, 18, 28, 0.75);
      backdrop-filter: blur(8px);
      padding: 12px 24px;
      border-radius: 16px;
      border: 1px solid rgba(255, 180, 50, 0.25);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .title-box h1 {
      font-size: 20px;
      color: #ffcc66;
      text-shadow: 0 0 10px rgba(255, 204, 102, 0.6);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-box span {
      font-size: 13px;
      color: #a0aec0;
      font-weight: normal;
    }
    .stat-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
      font-weight: bold;
    }
    .time-badge {
      color: #63b3ed;
    }
    .score-badge {
      color: #f6e05e;
    }
    .lantern-badge {
      color: #ed8936;
    }

    .hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .player-stats {
      background: rgba(14, 18, 28, 0.8);
      backdrop-filter: blur(8px);
      padding: 16px 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .flames-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .flame-icon {
      font-size: 24px;
      filter: drop-shadow(0 0 8px #ff7b00);
      transition: opacity 0.3s, transform 0.3s;
    }
    .flame-icon.lost {
      opacity: 0.2;
      filter: grayscale(1);
      transform: scale(0.8);
    }
    .carried-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
    }
    .carried-dots {
      display: flex;
      gap: 6px;
    }
    .mote-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 1px solid #ffcc00;
      transition: all 0.2s;
    }
    .mote-dot.filled {
      background: #ffdd44;
      box-shadow: 0 0 10px #ffdd44;
      transform: scale(1.1);
    }

    .controls-card {
      background: rgba(14, 18, 28, 0.75);
      backdrop-filter: blur(8px);
      padding: 14px 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 13px;
      color: #cbd5e0;
      line-height: 1.6;
    }
    .key {
      display: inline-block;
      background: #2d3748;
      color: #f7fafc;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      border-bottom: 2px solid #1a202c;
      margin: 0 2px;
    }

    /* Modal End Screen */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 7, 13, 0.85);
      backdrop-filter: blur(12px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      pointer-events: auto;
    }
    .modal-content {
      background: #141b2d;
      padding: 40px;
      border-radius: 24px;
      border: 2px solid #ffaa33;
      text-align: center;
      max-width: 440px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(255, 170, 51, 0.3);
      animation: popIn 0.4s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-title {
      font-size: 32px;
      margin-bottom: 12px;
    }
    .modal-subtitle {
      font-size: 15px;
      color: #a0aec0;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .modal-score {
      font-size: 22px;
      color: #f6e05e;
      margin-bottom: 28px;
    }
    .btn-restart {
      background: linear-gradient(135deg, #f6ad55, #dd6b20);
      color: #1a202c;
      font-weight: bold;
      font-size: 16px;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(221, 107, 32, 0.5);
      transition: transform 0.2s, background 0.2s;
    }
    .btn-restart:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #fbd38d, #ed8936);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <div class="hud-header">
      <div class="title-box">
        <h1>🏮 Đảo Đèn Lồng <span>· Đêm 1: Đảo Bến</span></h1>
      </div>
      <div class="stat-badge time-badge">
        ⏳ <span id="hud-time">180s</span>
      </div>
      <div class="stat-badge lantern-badge">
        🏮 <span id="hud-lanterns">0 / 5 Đèn</span>
      </div>
      <div class="stat-badge score-badge">
        ⭐ <span id="hud-score">0</span>
      </div>
    </div>

    <div class="hud-bottom">
      <div class="player-stats">
        <div class="flames-row">
          <span>Ngọn Lửa (HP):</span>
          <div id="flames-container">
            <span class="flame-icon" id="flame-1">🔥</span>
            <span class="flame-icon" id="flame-2">🔥</span>
            <span class="flame-icon" id="flame-3">🔥</span>
          </div>
        </div>
        <div class="carried-row">
          <span>Đom Đóm: <strong id="carried-count">0/5</strong></span>
          <div class="carried-dots" id="mote-dots">
            <div class="mote-dot"></div>
            <div class="mote-dot"></div>
            <div class="mote-dot"></div>
            <div class="mote-dot"></div>
            <div class="mote-dot"></div>
          </div>
        </div>
      </div>

      <div class="controls-card">
        <div><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> Di chuyển Mây</div>
        <div><span class="key">E</span> Thắp đèn (khi lại gần Đèn Lớn)</div>
        <div><span class="key">Q</span> Tỏa sáng (xua Bóng Mực, tốn 1 đom đóm)</div>
        <div><span class="key">Space</span> Nhảy nhẹ</div>
      </div>
    </div>
  </div>

  <div id="end-modal" class="modal-overlay">
    <div class="modal-content">
      <h2 id="modal-title" class="modal-title">CHIẾN THẮNG!</h2>
      <p id="modal-subtitle" class="modal-subtitle">5 Đèn Lồng Lớn đã bừng sáng rực rỡ, xua tan sương đen!</p>
      <div class="modal-score">Tổng điểm: <strong id="modal-score-val">1250</strong></div>
      <button id="btn-play-again" class="btn-restart">Chơi Lại</button>
    </div>
  </div>

  <script type="module" src="/src/ui/game.js"></script>
</body>
</html>
